<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="smBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <linearGradient id="smBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E62429" />
      <stop offset="50%" stop-color="#FF3338" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="smTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <filter id="smGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#E62429" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#smBgGrad)" stroke="url(#smBorderGrad)" stroke-width="4" />

  <!-- Corner Spider-Web Accents -->
  <path d="M 6 18 L 18 6" stroke="#E62429" stroke-width="2" opacity="0.8"/>
  <path d="M 46 58 L 58 46" stroke="#2563EB" stroke-width="2" opacity="0.8"/>

  <!-- Scanning Line -->
  <line x1="6" y1="32" x2="58" y2="32" stroke="#E62429" stroke-width="1.2" opacity="0.5" stroke-dasharray="3 2" />

  <!-- Monogram SM Text -->
  <text 
    x="32" 
    y="43" 
    font-family="'Orbitron', 'JetBrains Mono', 'Segoe UI', sans-serif" 
    font-size="29" 
    font-weight="900" 
    letter-spacing="1.2" 
    text-anchor="middle" 
    fill="url(#smTextGrad)"
    filter="url(#smGlow)"
  >
    SM
  </text>
</svg>